<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU - Цифровий университет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(165deg, #cbe3f7 0%, #e2f1fc 40%, #d8eefc 100%);
            --card-cream: #fbf9f4;
            --card-blue: #e3f2fd;
            --card-mint: #d8f3ec;
            --accent-blue: #0284c7;
            --text-dark: #293845;
            --text-muted: #64748b;
            --shadow-soft: 0 10px 25px rgba(100, 116, 139, 0.12);
            --radius-xl: 24px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-dark); min-height: 100vh; display: flex; justify-content: center; padding: 16px; }

        .mobile-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; margin: 0 auto; }

        .brand-header { text-align: center; margin-top: 10px; margin-bottom: 6px; }
        .brand-logo { font-family: 'Cinzel', serif; font-size: 38px; font-weight: 700; color: #3b5266; letter-spacing: 1px; }
        .brand-sub { font-size: 13px; color: #607d8b; margin-top: -4px; }

        .profile-card { background: var(--card-cream); border-radius: var(--radius-xl); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-soft); }
        .profile-left { display: flex; align-items: center; gap: 14px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: #d0e3f0; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--accent-blue); overflow: hidden; }
        .user-name { font-size: 15px; font-weight: 700; color: #2c3e50; line-height: 1.2; }
        .user-group { display: inline-block; background: #e8f1f8; color: #52718a; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; margin-top: 5px; }
        .logout-icon { color: #ef4444; font-size: 18px; cursor: pointer; background: #fee2e2; padding: 10px; border-radius: 50%; border: none; }

        .widget-card { background: var(--card-cream); border-radius: var(--radius-xl); padding: 18px; box-shadow: var(--shadow-soft); position: relative; }
        .widget-card.blue-bg { background: var(--card-blue); }
        .widget-card.mint-bg { background: var(--card-mint); }
        
        .widget-title { font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .widget-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }

        .info-buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .info-btn { background: #ffffff; border-radius: var(--radius-lg); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); cursor: pointer; border: none; }
        .info-btn:active { transform: scale(0.97); }
        .info-btn i { font-size: 18px; color: var(--accent-blue); }
        .info-btn span { font-size: 11px; font-weight: 600; color: #475569; }

        /* Блок Студентського Квитка */
        .student-card-box { display: flex; flex-direction: column; gap: 10px; background: rgba(255, 255, 255, 0.6); padding: 12px; border-radius: var(--radius-lg); border: 1px dashed #94a3b8; }
        .card-photos-container { display: flex; gap: 10px; }
        .card-photo-slot { flex: 1; height: 90px; background: #e2e8f0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; font-size: 11px; color: #64748b; cursor: pointer; }
        .card-photo-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .card-photo-slot i { font-size: 20px; margin-bottom: 4px; color: #0284c7; }

        .schedule-weeks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .week-tab { background: #ffffff; border-radius: var(--radius-lg); padding: 10px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; color: #64748b; }
        .week-tab.active { border-color: var(--accent-blue); color: var(--accent-blue); background: #f0f9ff; }

        .schedule-item {
