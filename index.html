<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цифровий Університет</title>

<!-- Зовнішні бібліотеки (завантажуються асинхронно, щоб не блокувати UI) -->
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>

<style>
:root {
    --primary: #4d5be4;
    --primary-hover: #3b49cb;
    --bg: #f4f6ff;
    --card: #ffffff;
    --text: #111735;
    --muted: #747b99;
    --border: #e8eaf5;
    --shadow: 0 10px 30px rgba(70,80,160,.08);
    --radius: 18px;
}

body.dark {
    --bg: #0f121d;
    --card: #181c2e;
    --text: #f0f3ff;
    --muted: #8e95b3;
    --border: #262c42;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }
@media(min-width: 769px) { body { padding-bottom: 0; } }

/* AUTH OVERLAY */
.auth-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
}
.auth-card {
    background: var(--card); border: 1px solid var(--border);
    padding: 30px; border-radius: 22px; width: 100%; max-width: 400px;
    box-shadow: var(--shadow); text-align: center;
}
.auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.auth-tab { flex: 1; border: 0; background: none; font-weight: 700; color: var(--muted); cursor: pointer; padding: 8px; font-size: 14px; }
.auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -12px; }

/* LAYOUT */
.app { display: flex; min-height: 100vh; }
.sidebar {
    position: fixed; top: 15px; left: 15px; bottom: 15px; width: 240px;
    border-radius: 22px; padding: 25px 16px;
    background: linear-gradient(180deg, #4d5be4 0%, #3f4cc7 100%);
    color: white; z-index: 100; display: flex; flex-direction: column; gap: 15px;
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 14px; }
.logo { width: 38px; height: 38px; border: 2px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

.nav { display: flex; flex-direction: column; gap: 6px; flex: 1; margin-top: 15px; }
.nav-item {
    border: 0; background: transparent; color: rgba(255,255,255,0.85);
    padding: 12px 14px; border-radius: 12px; display: flex; align-items: center;
    gap: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.15); color: white; }
.nav-item.active { background: white; color: var(--primary); }

.main { width: calc(100% - 270px); margin-left: 270px; padding: 25px; }
.header { background: var(--card); border-radius: var(--radius); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); margin-bottom: 20px; }

.page { display: none; }
.page.active { display: block; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }

/* BUTTONS & INPUTS */
.btn-primary { background: var(--primary); color: white; border: 0; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { background: #ef4444; color: white; border: 0; }
.input-field { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 10px; outline: none; }

/* MOBILE NAV */
.mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: var(--card); border-top: 1px solid var(--border); z-index: 1000;
    justify-content: space-around; align-items: center;
}
.mobile-nav-item { border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mobile-nav-item.active { color: var(--primary); }

@media(max-width: 768px) {
    .sidebar { display: none; }
    .main { width: 100%; margin: 0; padding: 15px; }
    .mobile-nav { display: flex; }
}
</style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
        <div class="logo" style="margin: 0 auto 10px auto; background: var(--primary); color: white;">DU</div>
        <h3 style="margin-bottom: 15px;">Цифровий Університет</h3>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLoginBtn">Вхід</button>
            <button class="auth-tab" id="tabRegisterBtn">Реєстрація</button>
        </div>

        <div id="formLogin">
            <input type="text" id="loginUser" class="input-field" placeholder="Логін (або 'admin')">
            <input type="password" id="loginPass" class="input-field" placeholder="Пароль (або '123')">
            <button class="btn-primary" style="width: 100%;" id="btnLoginSubmit">Увійти</button>
        </div>

        <div id="formRegister" style="display: none;">
            <input type="text" id="regUser" class="input-field" placeholder="Новий логін">
            <input type="password" id="regPass" class="input-field" placeholder="Пароль">
            <input type="text" id="regSecret" class="input-field" placeholder="Секретне слово">
            <button class="btn-primary" style="width: 100%;" id="btnRegisterSubmit">Зареєструватися</button>
        </div>
    </div>
</div>

<div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="logo">DU</div>
            <div>ЦИФРОВИЙ УНІВЕРСИТЕТ</div>
        </div>
        <nav class="nav">
            <button class="nav-item active" data-page="home">🏠 Головна</button>
            <button class="nav-item" data-page="student-card-page">🪪 Студ. квиток</button>
            <button class="nav-item" data-page="tasks-page">📝 Завдання</button>
            <button class="nav-item" data-page="settings-page">⚙️ Налаштування</button>
        </nav>
    </aside>

    <main class="main">
        <header class="header">
            <div>
                <h2>Вітаємо в системі</h2>
                <span id="currentUserLabel" style="font-size: 13px; font-weight: bold; color: var(--primary);">Студент</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" id="btnToggleTheme">🌙 Тема</button>
                <button class="btn-primary btn-danger" id="btnLogout">Вийти</button>
            </div>
        </header>

        <!-- PAGES -->
        <section class="page active" id="home">
            <div class="card">
                <h3>📚 Головна панель</h3>
                <p style="margin-top: 10px; color: var(--muted);">Система працює успішно. Усі кнопки та вкладки активовано.</p>
            </div>
        </section>

        <section class="page" id="student-card-page">
            <div class="card" style="text-align: center;">
                <h3>🪪 Електронний Студентський Квиток</h3>
                <p style="margin-top: 10px; color: var(--muted);" id="cardStatus">Квиток не згенеровано.</p>
                <button class="btn-primary" style="margin-top: 15px;" id="btnGenerateDemo">🧪 Згенерувати Демо-Квиток</button>
            </div>
        </section>

        <section class="page" id="tasks-page">
            <div class="card">
                <h3>📝 Список Завдань</h3>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <input type="text" id="taskInput" class="input-field" placeholder="Нове завдання..." style="margin-bottom:0;">
                    <button class="btn-primary" id="btnAddTask">Додати</button>
                </div>
                <ul id="taskList" style="margin-top: 15px; list-style: none;"></ul>
            </div>
        </section>

        <section class="page" id="settings-page">
            <div class="card">
                <h3>⚙️ Налаштування</h3>
                <button class="btn-primary" style="margin-top: 15px;" id="btnClearData">🗑️ Очистити дані LocalStorage</button>
            </div>
        </section>
    </main>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
    <button class="mobile-nav-item active" data-page="home"><span>🏠</span><span>Головна</span></button>
    <button class="mobile-nav-item" data-page="student-card-page"><span>🪪</span><span>Квиток</span></button>
    <button class="mobile-nav-item" data-page="tasks-page"><span>📝</span><span>Завдання</span></button>
    <button class="mobile-nav-item" data-page="settings-page"><span>⚙️</span><span>Опції</span></button>
</nav>

<script>
// Надійна ініціалізація після повного завантаження DOM
document.addEventListener('DOMContentLoaded', () => {
    
    // --- ДАНИЙ РЕПОЗИТОРІЙ / СТАН ---
    const DB = {
        getUsers: () => JSON.parse(localStorage.getItem('app_users')) || [],
        setUsers: (users) => localStorage.setItem('app_users', JSON.stringify(users)),
        getCurrentUser: () => JSON.parse(localStorage.getItem('app_current_user')),
        setCurrentUser: (user) => localStorage.setItem('app_current_user', JSON.stringify(user))
    };

    // Створення дефолтного адміна якщо пустко
    if (DB.getUsers().length === 0) {
        DB.setUsers([{ username: 'admin', password: '123', secret: 'admin', tasks: [] }]);
    }

    let currentUser = DB.getCurrentUser();

    // --- НАВІГАЦІЯ ВКТАДОК ---
    function navigateTo(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(b => b.classList.remove('active'));

        const targetPage = document.getElementById(pageId);
        if (targetPage) targetPage.classList.add('active');

        document.querySelectorAll(`[data-page="${pageId}"]`).forEach(b => b.classList.add('active'));
    }

    document.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', () => navigateTo(btn.dataset.page));
    });

    // --- АВТОРИЗАЦІЯ ВІКНА ---
    const authOverlay = document.getElementById('authOverlay');
    const tabLoginBtn = document.getElementById('tabLoginBtn');
    const tabRegisterBtn = document.getElementById('tabRegisterBtn');
    const formLogin = document.getElementById('formLogin');
    const formRegister = document.getElementById('formRegister');

    tabLoginBtn.addEventListener('click', () => {
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
    });

    tabRegisterBtn.addEventListener('click', () => {
        formLogin.style.display = 'none';
        formRegister.style.display = 'block';
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
    });

    // ВХІД
    document.getElementById('btnLoginSubmit').addEventListener('click', () => {
        const uVal = document.getElementById('loginUser').value.trim();
        const pVal = document.getElementById('loginPass').value.trim();

        const users = DB.getUsers();
        const user = users.find(u => u.username === uVal && u.password === pVal);

        if (user) {
            currentUser = user;
            DB.setCurrentUser(user);
            updateUI();
        } else {
            alert('Невірний логін або пароль! Спробуйте: admin / 123');
        }
    });

    // РЕЄСТРАЦІЯ
    document.getElementById('btnRegisterSubmit').addEventListener('click', () => {
        const uVal = document.getElementById('regUser').value.trim();
        const pVal = document.getElementById('regPass').value.trim();
        const sVal = document.getElementById('regSecret').value.trim();

        if (!uVal || !pVal) return alert('Заповніть усі поля!');

        let users = DB.getUsers();
        if (users.find(u => u.username === uVal)) return alert('Користувач існує!');

        const newUser = { username: uVal, password: pVal, secret: sVal, tasks: [] };
        users.push(newUser);
        DB.setUsers(users);

        alert('Реєстрація успішна! Увійдіть під своїм логіном.');
        tabLoginBtn.click();
    });

    // ВИХІД
    document.getElementById('btnLogout').addEventListener('click', () => {
        localStorage.removeItem('app_current_user');
        currentUser = null;
        updateUI();
    });

    // ТЕМА
    document.getElementById('btnToggleTheme').addEventListener('click', () => {
        document.body.classList.toggle('dark');
    });

    // ОЧИЩЕННЯ ДАНИХ
    document.getElementById('btnClearData').addEventListener('click', () => {
        localStorage.clear();
        location.reload();
    });

    // ЗАВДАННЯ
    document.getElementById('btnAddTask').addEventListener('click', () => {
        const input = document.getElementById('taskInput');
        if (!input.value.trim() || !currentUser) return;

        currentUser.tasks = currentUser.tasks || [];
        currentUser.tasks.push(input.value.trim());
        
        saveUser();
        input.value = '';
        renderTasks();
    });

    function saveUser() {
        let users = DB.getUsers();
        let idx = users.findIndex(u => u.username === currentUser.username);
        if (idx !== -1) users[idx] = currentUser;
        DB.setUsers(users);
        DB.setCurrentUser(currentUser);
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        if (!currentUser || !currentUser.tasks) {
            list.innerHTML = '';
            return;
        }
        list.innerHTML = currentUser.tasks.map((t, i) => `
            <li style="padding: 8px; background: var(--bg); margin-bottom: 5px; border-radius: 8px; display: flex; justify-content: space-between;">
                <span>${t}</span>
                <button class="btn-primary btn-danger" style="padding: 2px 8px; font-size: 11px;" onclick="deleteTask(${i})">✕</button>
            </li>
        `).join('');
    }

    window.deleteTask = function(i) {
        currentUser.tasks.splice(i, 1);
        saveUser();
        renderTasks();
    };

    // ДЕМО КВИТОК
    document.getElementById('btnGenerateDemo').addEventListener('click', () => {
        document.getElementById('cardStatus').textContent = "✅ Дійсний квиток: KB-" + Math.floor(10000000 + Math.random() * 90000000);
    });

    // ОНОВЛЕННЯ СТАНУ UI
    function updateUI() {
        if (currentUser) {
            authOverlay.style.display = 'none';
            document.getElementById('currentUserLabel').textContent = currentUser.username;
            renderTasks();
        } else {
            authOverlay.style.display = 'flex';
        }
    }

    // Запуск при завантаженні
    updateUI();
});
</script>
</body>
</html>
