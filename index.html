<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU - Цифровий Університет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

        .app-container { max-width: 430px; margin: 0 auto; padding: 16px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-greeting h3 { font-size: 18px; font-weight: 700; }
        .user-greeting p { font-size: 12px; color: var(--text-muted); }
        .avatar-box { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary); }
        
        .promo-card { background: linear-gradient(135deg, #312e81 0%, #4f46e5 100%); border-radius: var(--radius-lg); padding: 20px; color: white; margin-bottom: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .promo-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .promo-card p { font-size: 12px; opacity: 0.8; margin-bottom: 12px; }
        .code-badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }

        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .quick-item { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 8px; text-align: center; box-shadow: var(--shadow); cursor: pointer; border: none; }
        .quick-item i { font-size: 18px; color: var(--primary); margin-bottom: 6px; display: block; }
        .quick-item span { font-size: 11px; font-weight: 600; color: var(--text-main); }

        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .view-all { font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }

        .schedule-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; }
        .schedule-time { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 6px 10px; border-radius: 8px; text-align: center; }
        .schedule-info { flex: 1; margin-left: 12px; }
        .schedule-info h5 { font-size: 13px; font-weight: 700; }
        .schedule-info p { font-size: 11px; color: var(--text-muted); }
