<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU - Цифровий университет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(160deg, #dbeafe 0%, #eff6ff 45%, #e0f2fe 100%);
            --card-cream: #fefcf6;
            --card-blue: #e0f2fe;
            --card-mint: #e6f4f1;
            --accent-green: #22c55e;
            --accent-blue: #0284c7;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-subtle: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 10px 30px -5px rgba(148, 163, 184, 0.25);
            --radius-xl: 28px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-dark); min-height: 100vh; display: flex; justify-content: center; }

        /* Оверлей та модальні вікна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }

        .modal-card {
            background: #ffffff; border-radius: var(--radius-xl); padding: 30px; width: 100%; max-width: 500px;
            box-shadow: var(--shadow-soft); max-height: 90vh; overflow-y: auto; position: relative;
        }

        .auth-title { font-family: 'Cinzel', serif; font-size: 36px; color: var(--accent-blue); text-align: center; }
        .auth-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; text-align: center; }
        .auth-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: block; }
        .form-input, .form-select { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; font-size: 14px; }
        .auth-btn { background: var(--accent-blue); color: white; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .auth-btn.admin-btn { background: #ea580c; }
        .toggle-auth { font-size: 13px; color: var(--accent-blue); cursor: pointer; margin-top: 16px; display: inline-block; text-align: center; width: 100%; text-decoration: underline; }

        /* Табло сповіщень */
        .notification-banner {
            background: #3b82f6; color: white; padding: 12px 20px; border-radius: 16px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Layout */
        .app-layout { width: 100%; max-width: 1100px; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; padding: 40px 24px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-right: 1px solid var(--border-subtle); }
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-logo { font-family: 'Cinzel', serif; font-size: 42px; font-weight: 500; color: #334155; }
        .brand-sub { font-size: 14px; color: var(--text-muted); }
        .desktop-nav { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .desktop-nav a { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-radius: var(--radius-lg); color: var(--text-dark); text-decoration: none; font-weight: 600; }
        .desktop-nav li.active a { background: #ffffff; box-shadow: var(--shadow-soft); color: var(--accent-blue); }

        .content-area { flex: 1; padding: 40px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; max-width: 580px; margin: 0 auto; }
        .widget-card { border-radius: var(--radius-xl); padding: 22px; background: var(--card-cream); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-soft); position: relative; }
        .widget-card.blue-variant { background: var(--card-blue); }
        .widget-card.mint-variant { background: var(--card-mint); }

        .profile-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
        .profile-info { display: flex; align-items: center; gap: 18px; }
        .avatar-frame { width: 72px; height: 72px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--accent-blue); flex-shrink: 0; }
        .profile-meta h2 { font-size: 18px; font-weight: 700; }
        .badge-group { display: inline-block; background: #ffffff; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); border: 1px solid #e2e8f0; margin-top: 4px; }

        .logout-btn-card {
            background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 12px;
            font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: background 0.2s;
        }
        .logout-btn-card:hover { background: #dc2626; }

        .widget-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .schedule-item { background: #ffffff; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .schedule-time { font-size: 12px; font-weight: 700; color: var(--accent-blue); background: #e0f2fe; padding: 4px 8px; border-radius: 6px; }

        .admin-edit-btn { background: #ea580c; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }

        .action-dock { background: rgba(187, 247, 208, 0.4); backdrop-filter: blur(15px); border-radius: 35px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        .dock-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 18px; background: #22c55e; }

        @media (max-width: 768px) { .sidebar { display: none; } .content-area { padding: 20px 16px; } }
    </style>
</head>
<body>

    <!-- Вікно сповіщення -->
    <div id="notificationBanner" class="notification-banner" style="display: none;">
        <i class="fa-solid fa-bell fa-bounce" style="font-size: 20px;"></i>
        <div id="notificationText">Пара розпочнеться через 10 хвилин!</div>
    </div>

    <!-- Вікно Авторизації -->
    <div id="authOverlay" class="modal-overlay">
        <div class="modal-card">
            <div class="auth-title">DU</div>
            <div class="auth-sub">Цифровий університет</div>

            <form id="authForm" class="auth-form">
                <div class="form-group" id="fullNameGroup" style="display: none;">
                    <label>Повне ім'я (ПІБ)</label>
                    <input type="text" id="regFullName" class="form-input" placeholder="Ігнатенко Євген Олександрович">
                </div>
                <div class="form-group" id="groupNameGroup" style="display: none;">
                    <label>Група</label>
                    <input type="text" id="regGroup" class="form-input" placeholder="Б-Ф7-25-1-КС">
                </div>
                <div class="form-group">
                    <label>Логін або Email (для Адміна: admin)</label>
                    <input type="text" id="authLogin" class="form-input" placeholder="student@du.edu.ua" required>
                </div>
                <div class="form-group">
                    <label>Пароль (для Адміна: admin)</label>
                    <input type="password" id="authPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" id="authSubmitBtn" class="auth-btn">Увійти</button>
            </form>

            <span id="toggleAuthMode" class="toggle-auth">Немає акаунту? Зареєструватися</span>
        </div>
    </div>

    <!-- Модальне вікно Адміна: Редагування розкладу -->
    <div id="adminModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="widget-title">⚙️ Редагування розкладу (Адмін)</div>
            <form id="adminScheduleForm" class="auth-form">
                <div class="form-group">
                    <label>Виберіть тиждень</label>
                    <select id="adminWeekSelect" class="form-select">
                        <option value="week1">Тиждень 1</option>
                        <option value="week2">Тиждень 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Виберіть день тижня</label>
                    <select id="adminDaySelect" class="form-select">
                        <option value="Понеділок">Понеділок</option>
                        <option value="Вівторок">Вівторок</option>
                        <option value="Середа">Середа</option>
                        <option value="Четвер">Четвер</option>
                        <option value="П'ятниця">П'ятниця</option>
                        <option value="Субота">Субота</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Назва предмета</label>
                    <input type="text" id="adminSubject" class="form-input" placeholder="Вища математика" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Час початку</label>
                        <input type="time" id="adminStart" class="form-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Час завершення</label>
                        <input type="time" id="adminEnd" class="form-input" required>
                    </div>
                </div>
                <button type="submit" class="auth-btn admin-btn">Додати пару</button>
                <button type="button" id="closeAdminModal" class="auth-btn" style="background: #64748b;">Закрити</button>
            </form>
        </div>
    </div>

    <!-- Основний додаток -->
    <div class="app-layout">
        <aside class="sidebar">
            <div>
                <div class="brand-header">
                    <div class="brand-logo">DU</div>
                    <div class="brand-sub">Цифровий университет</div>
                </div>
                <ul class="desktop-nav">
                    <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Головна</a></li>
                    <li><a href="#" id="logoutBtnNav"><i class="fa-solid fa-right-from-bracket"></i> Вийти</a></li>
                </ul>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-muted);">DU App © 2026</div>
        </aside>

        <main class="content-area">
            <div class="brand-header">
                <div class="brand-logo">DU</div>
                <div class="brand-sub">Цифровий университет</div>
            </div>

            <!-- Шапка профілю -->
            <section class="widget-card">
                <div class="profile-row">
                    <div class="profile-info">
                        <div class="avatar-frame"><i class="fa-solid fa-user"></i></div>
                        <div class="profile-meta">
                            <h2 id="userFullName">Студент</h2>
                            <span class="badge-group" id="userGroup">Група</span>
                        </div>
                    </div>
                    <!-- Кнопка виходу з акаунту прямо на мобільному/картці -->
                    <button id="logoutBtnCard" class="logout-btn-card">
                        <i class="fa-solid fa-right-from-bracket"></i> Вийти
                    </button>
                </div>
            </section>

            <!-- Блок Адміністратора (видимий тільки для admin) -->
            <section id="adminWidgetCard" class="widget-card" style="display: none; background: #fff7ed; border-color: #ffedd5;">
                <div class="widget-title" style="color: #c2410c;">
                    Панель Управління
                    <button class="admin-edit-btn" id="openAdminModalBtn"><i class="fa-solid fa-pen"></i> Редагувати розклад</button>
                </div>
            </section>

            <!-- Актуальний розклад -->
            <section class="widget-card">
                <div class="widget-title">
                    <span id="scheduleTitle">📅 Розклад занять</span>
                    <span id="currentWeekBadge" class="badge-group" style="background: #e0f2fe; color: #0284c7;">Тиждень 1</span>
                </div>
                <div id="scheduleContainer">
                    <!-- Пари завантажуються динамічно -->
                </div>
            </section>

            <!-- Швидкий перехід -->
            <div class="action-dock">
                <span style="font-size: 12px; color: #15803d; font-weight: 600;">Швидкий перехід...</span>
                <div style="display: flex; gap: 10px;">
                    <a href="https://t.me" target="_blank" class="dock-btn"><i class="fa-brands fa-telegram"></i></a>
                    <a href="https://classroom.google.com" target="_blank" class="dock-btn" style="background: #15803d;"><i class="fa-solid fa-graduation-cap"></i></a>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
