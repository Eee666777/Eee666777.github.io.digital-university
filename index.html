<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital University Portal</title>

<style>
:root {
    --primary: #4d5be4;
    --primary-hover: #3b49cb;
    --bg: #f4f6ff;
    --card: #ffffff;
    --text: #111735;
    --muted: #747b99;
    --border: #e8eaf5;
    --shadow: 0 10px 30px rgba(70,80,160,.08);
    --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    padding-bottom: 70px;
}
body.dark {
    --bg: #0f121d;
    --card: #181c2e;
    --text: #f0f3ff;
    --muted: #8e95b3;
    --border: #262c42;
}

@media(min-width: 769px) { body { padding-bottom: 0; } }

/* AUTH OVERLAY */
.auth-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
}
.auth-card {
    background: var(--card); border: 1px solid var(--border);
    padding: 30px; border-radius: 22px; width: 100%; max-width: 400px;
    box-shadow: var(--shadow); text-align: center;
}
.auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.auth-tab { flex: 1; border: 0; background: none; font-weight: 700; color: var(--muted); cursor: pointer; padding: 8px; font-size: 14px; }
.auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -12px; }

.app { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
    position: fixed; top: 15px; left: 15px; bottom: 15px;
    width: 250px; border-radius: 22px; padding: 25px 16px;
    background: linear-gradient(180deg, #4d5be4 0%, #3f4cc7 100%);
    color: white; box-shadow: 0 15px 35px rgba(68,80,210,.25);
    z-index: 100; display: flex; flex-direction: column; gap: 15px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 5px; }
.logo { width: 42px; height: 42px; border: 2px solid white; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 900; }
.brand-title { font-weight: 800; font-size: 13px; line-height: 1.1; }

.nav { display: flex; flex-direction: column; gap: 6px; flex: 1; margin-top: 15px; }
.nav-item { border: 0; background: transparent; color: rgba(255,255,255,0.85); padding: 12px 14px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; transition: .2s; }
.nav-item:hover { background: rgba(255,255,255,.15); color: white; }
.nav-item.active { background: white; color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,.08); }
.admin-only { display: none; }

/* MAIN CONTENT */
.main { width: calc(100% - 280px); margin-left: 280px; padding: 25px 30px; }
.header { background: var(--card); border-radius: var(--radius); padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }

.page { display: none; }
.page.active { display: block; animation: fadeIn .25s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; }

.task-card-item { background: var(--bg); border: 1px solid var(--border); padding: 14px; border-radius: 12px; margin-bottom: 10px; font-size: 13px; }
.task-card-item.completed { opacity: 0.6; text-decoration: line-through; }
.task-dates { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 15px; }

/* BUTTONS & INPUTS */
.btn-primary { background: var(--primary); color: white; border: 0; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
.btn-danger { background: #ef4444; color: white; border: 0; }

.input-field { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; margin-bottom: 10px; font-size: 13px; }

.columns-grid { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 10px; }
.column-day { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; min-height: 380px; }
.column-header { font-weight: 800; font-size: 14px; color: var(--primary); padding-bottom: 8px; border-bottom: 2px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.lesson-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 12px; }

.week-toggle { display: flex; gap: 10px; margin-bottom: 18px; }
.toggle-btn { padding: 8px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-weight: 700; cursor: pointer; color: var(--text); }
.toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* CALENDAR STYLES */
.calendar-container { margin-top: 10px; }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; }
.calendar-day-name { font-weight: bold; color: var(--muted); padding-bottom: 4px; }
.calendar-day { padding: 8px 0; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
.calendar-day:hover { background: var(--border); }
.calendar-day.today { background: var(--primary); color: white; font-weight: bold; }
.calendar-day.empty { background: transparent; border: none; cursor: default; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(5px); }
.modal-box { background: var(--card); padding: 25px; border-radius: 20px; max-width: 500px; width: 90%; border: 1px solid var(--border); }

/* MOBILE BOTTOM BAR */
.mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    height: 65px; background: var(--card); border-top: 1px solid var(--border);
    z-index: 1000; justify-content: space-around; align-items: center; padding: 0 10px;
}
.mobile-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); border: 0; background: none; font-size: 11px; font-weight: 600; gap: 3px; cursor: pointer; flex: 1; }
.mobile-nav-item.active { color: var(--primary); }

@media(max-width: 768px) {
    .sidebar { display: none; }
    .main { width: 100%; margin: 0; padding: 15px; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .columns-grid { grid-template-columns: repeat(1, 1fr); }
    .mobile-nav { display: flex; }
}
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
        <div class="logo" style="margin: 0 auto 10px auto; background: var(--primary); color: white;">DU</div>
        <h3 style="margin-bottom: 15px;">Цифровий Університет</h3>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Вхід</button>
            <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Реєстрація</button>
        </div>

        <div id="formLogin">
            <input type="text" id="loginUser" class="input-field" placeholder="Логін">
            <input type="password" id="loginPass" class="input-field" placeholder="Пароль">
            <button class="btn-primary" style="width: 100%; margin-top: 5px;" onclick="handleLogin()">Увійти</button>
        </div>

        <div id="formRegister" style="display: none;">
            <input type="text" id="regUser" class="input-field" placeholder="Логін">
            <input type="password" id="regPass" class="input-field" placeholder="Пароль">
            <input type="text" id="regSecret" class="input-field" placeholder="Секретне кодове слово">
            <button class="btn-primary" style="width: 100%;" onclick="handleRegister()">Зареєструватися</button>
        </div>
    </div>
</div>

<div class="app">

<aside class="sidebar">
    <div class="brand">
        <div class="logo">DU</div>
        <div class="brand-title">ЦИФРОВИЙ<br>УНІВЕРСИТЕТ</div>
    </div>
    <nav class="nav">
        <button class="nav-item active" data-page="home">🏠 Головна сторінка</button>
        <button class="nav-item" data-page="tasks-page">📝 Завдання</button>
        <button class="nav-item" data-page="schedule">📚 Розклад</button>
        <button class="nav-item" data-page="settings-page">⚙️ Налаштування</button>
        <button class="nav-item admin-only" id="adminSidebarBtn" data-page="admin-page">🛡️ Панель Адміна</button>
    </nav>
</aside>

<main class="main">
    <header class="header">
        <div>
            <h2>Навчальний портал</h2>
            <p style="color:var(--muted); font-size:12px;" id="currentDateStr"></p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <span style="font-size:13px; font-weight:bold;" id="currentUserLabel">Студент</span>
            <button class="btn-primary" style="background:var(--bg); color:var(--text); border:1px solid var(--border);" onclick="toggleDarkMode()">🌙 Тема</button>
            <button class="btn-primary btn-danger" onclick="handleLogout()">Вийти</button>
        </div>
    </header>

    <!-- HOME PAGE -->
    <section class="page active" id="home">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            
            <!-- РОЗКЛАД НА СЬОГОДНІ / СУБОТУ -->
            <div class="card">
                <h3>📚 Розклад заняття</h3>
                <p style="font-size:12px; color:var(--muted); margin-bottom:15px;" id="todayScheduleTitle">Заняття:</p>
                <div id="todayScheduleContainer"></div>
            </div>

            <!-- КАЛЕНДАР -->
            <div class="card">
                <h3>📅 Календар</h3>
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button class="btn-primary btn-small" onclick="changeMonth(-1)">◄</button>
                        <span id="calendarMonthLabel"></span>
                        <button class="btn-primary btn-small" onclick="changeMonth(1)">►</button>
                    </div>
                    <div class="calendar-grid" id="calendarDaysGrid"></div>
                </div>
            </div>

            <!-- ЗАВДАННЯ -->
            <div class="card">
                <h3>📝 Поточні завдання</h3>
                <div id="homeTasksContainer" style="margin-top: 10px;"></div>
            </div>

        </div>
    </section>

    <!-- TASKS PAGE -->
    <section class="page" id="tasks-page">
        <div class="card">
            <h2>📝 Мої Завдання</h2>
            <div style="background:var(--bg); border:1px solid var(--border); padding:15px; border-radius:14px; margin: 15px 0;">
                <input type="text" id="newTaskTitle" class="input-field" placeholder="Назва завдання...">
                <button class="btn-primary" style="width:100%;" onclick="addNewTask()">Додати завдання</button>
            </div>
            <div id="tasksContainer"></div>
        </div>
    </section>

    <!-- SCHEDULE PAGE -->
    <section class="page" id="schedule">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                <h2>📚 Персональний розклад</h2>
                <div class="week-toggle">
                    <button class="toggle-btn active" id="btnW1" onclick="switchWeek('week1')">I Тиждень</button>
                    <button class="toggle-btn" id="btnW2" onclick="switchWeek('week2')">II Тиждень</button>
                </div>
            </div>
            <div class="columns-grid" id="scheduleColumnsContainer"></div>
        </div>
    </section>

    <!-- SETTINGS PAGE -->
    <section class="page" id="settings-page">
        <div class="card">
            <h2>⚙️ Налаштування</h2>
            <p style="margin-top:10px;">Управління стилем та параметрами профілю.</p>
            <button class="btn-primary" style="margin-top:15px;" onclick="toggleDarkMode()">Переключити тему</button>
        </div>
    </section>

</main>
</div>

<nav class="mobile-nav">
    <button class="mobile-nav-item active" data-page="home"><span>🏠</span><span>Головна</span></button>
    <button class="mobile-nav-item" data-page="schedule"><span>📚</span><span>Розклад</span></button>
    <button class="mobile-nav-item" data-page="tasks-page"><span>📝</span><span>Завдання</span></button>
    <button class="mobile-nav-item" data-page="settings-page"><span>⚙️</span><span>Опції</span></button>
</nav>

<script>
const DB = {
    getUsers: () => JSON.parse(localStorage.getItem('app_users')) || [],
    setUsers: (users) => localStorage.setItem('app_users', JSON.stringify(users)),
    getCurrentUser: () => JSON.parse(localStorage.getItem('app_current_user')),
    setCurrentUser: (user) => localStorage.setItem('app_current_user', JSON.stringify(user))
};

const defaultSchedule = {
    week1: {
        0: [{ name: "Фахова англійська мова", time: "15:20 - 16:55" }],
        1: [{ name: "Системне програмування", time: "15:20 - 16:55" }],
        2: [{ name: "Основи комп'ютерних мереж", time: "15:20 - 16:55" }],
        3: [{ name: "Системне програмування (Лаб.)", time: "15:20 - 16:55" }],
        4: [{ name: "Комп'ютерна схемотехніка", time: "15:20 - 16:55" }],
        5: [{ name: "Консультації / Практикум", time: "10:00 - 11:35" }]
    },
    week2: {
        0: [{ name: "Комп'ютерна схемотехніка", time: "15:20 - 16:55" }],
        1: [{ name: "Архітектура комп'ютерів", time: "15:20 - 16:55" }],
        2: [{ name: "Основи комп'ютерних мереж", time: "15:20 - 16:55" }],
        3: [{ name: "Архітектура комп'ютерів (Лаб.)", time: "15:20 - 16:55" }],
        4: [{ name: "Фахова англійська мова", time: "17:10 - 18:45" }],
        5: [{ name: "Лабораторний практикум", time: "12:00 - 13:35" }]
    }
};

if (DB.getUsers().length === 0) {
    DB.setUsers([{ username: 'admin', password: '123', secret: 'admin', isAdmin: true, tasks: [], schedule: defaultSchedule }]);
}

let currentUser = DB.getCurrentUser();
const days = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
let calendarDate = new Date();

function initApp() {
    if (!currentUser) {
        document.getElementById('authOverlay').style.display = 'flex';
        return;
    }
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('currentUserLabel').textContent = currentUser.username;

    renderHomeDashboard();
    renderTasks();
    renderSchedule();
    renderCalendar();
}

/* РАХУНОК ТИЖНЯ ТА СУБОТНЬОЇ ЛОГІКИ */
function renderHomeDashboard() {
    const todayContainer = document.getElementById('todayScheduleContainer');
    const now = new Date();
    const currentDay = now.getDay(); 
    const currentHour = now.getHours();

    let targetDayIdx = currentDay === 0 ? 0 : currentDay - 1; 
    let displayTitle = "";
    let weekKey = 'week1'; 

    // Логіка для П'ятниці та Суботи стосовно 12:00
    if (currentDay === 5 && currentHour >= 12) {
        targetDayIdx = 5; // Показываем Субботу
        displayTitle = "Заняття на завтра (Субота):";
    } else if (currentDay === 6 && currentHour < 12) {
        targetDayIdx = 5; // Показываем Субботу
        displayTitle = "Заняття на сьогодні (Субота):";
    } else {
        displayTitle = `Заняття на ${days[targetDayIdx]}:`;
    }

    document.getElementById('todayScheduleTitle').textContent = displayTitle;

    const weekSchedule = currentUser.schedule ? currentUser.schedule[weekKey] : {};
    const dayLessons = weekSchedule ? (weekSchedule[targetDayIdx] || []) : [];

    if (!dayLessons.length) {
        todayContainer.innerHTML = '<p style="font-size:12px; color:var(--muted);">Пар немає 🎉</p>';
    } else {
        todayContainer.innerHTML = dayLessons.map(l => `
            <div class="lesson-card">
                <div style="font-size:10px; color:var(--primary); font-weight:700;">⏰ ${l.time}</div>
                <div style="font-weight:700; font-size:13px; margin-top:2px;">${l.name}</div>
            </div>
        `).join('');
    }
}

/* КАЛЕНДАР */
function renderCalendar() {
    const label = document.getElementById('calendarMonthLabel');
    const grid = document.getElementById('calendarDaysGrid');
    
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
    label.textContent = `${monthNames[month]} ${year}`;

    grid.innerHTML = '';

    const weekDays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
    weekDays.forEach(d => {
        grid.innerHTML += `<div class="calendar-day-name">${d}</div>`;
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let startOffset = firstDay === 0 ? 6 : firstDay - 1;

    for (let i = 0; i < startOffset; i++) {
        grid.innerHTML += `<div class="calendar-day empty"></div>`;
    }

    const today = new Date();

    for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        grid.innerHTML += `<div class="calendar-day ${isToday ? 'today' : ''}">${d}</div>`;
    }
}

function changeMonth(delta) {
    calendarDate.setMonth(calendarDate.getMonth() + delta);
    renderCalendar();
}

/* АВТОРИЗАЦІЯ ТА НАВІГАЦІЯ */
function switchAuthTab(type) {
    document.getElementById('formLogin').style.display = type === 'login' ? 'block' : 'none';
    document.getElementById('formRegister').style.display = type === 'register' ? 'block' : 'none';
    document.getElementById('tabLogin').classList.toggle('active', type === 'login');
    document.getElementById('tabRegister').classList.toggle('active', type === 'register');
}

function handleLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    let users = DB.getUsers();
    let found = users.find(u => u.username === user && u.password === pass);

    if (found) {
        currentUser = found;
        DB.setCurrentUser(found);
        initApp();
    } else {
        alert("Невірний логін або пароль");
    }
}

function handleRegister() {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const secret = document.getElementById('regSecret').value.trim();

    if (!username || !password) return alert("Заповніть всі поля");

    let users = DB.getUsers();
    users.push({ username, password, secret, isAdmin: false, tasks: [], schedule: defaultSchedule });
    DB.setUsers(users);
    alert("Реєстрація успішна!");
    switchAuthTab('login');
}

function handleLogout() {
    localStorage.removeItem('app_current_user');
    currentUser = null;
    document.getElementById('authOverlay').style.display = 'flex';
}

function toggleDarkMode() {
    document.body.classList.toggle('dark');
}

let currentWeek = 'week1';
function switchWeek(w) {
    currentWeek = w;
    document.getElementById('btnW1').classList.toggle('active', w === 'week1');
    document.getElementById('btnW2').classList.toggle('active', w === 'week2');
    renderSchedule();
}

function renderSchedule() {
    const container = document.getElementById('scheduleColumnsContainer');
    if (!currentUser.schedule) currentUser.schedule = defaultSchedule;
    const weekData = currentUser.schedule[currentWeek] || {};

    container.innerHTML = days.map((d, i) => {
        const list = weekData[i] || [];
        return `
            <div class="column-day">
                <div class="column-header">${d}</div>
                <div>${list.map(l => `
                    <div class="lesson-card">
                        <div style="font-size:10px; color:var(--muted); font-weight:700;">⏰ ${l.time}</div>
                        <div style="font-weight:700;">${l.name}</div>
                    </div>
                `).join('') || '<p style="font-size:11px; color:var(--muted); text-align:center;">Немає пар</p>'}</div>
            </div>`;
    }).join('');
}

function renderTasks() {
    const container = document.getElementById('tasksContainer');
    const tasks = currentUser.tasks || [];
    container.innerHTML = tasks.map((t, i) => `<div class="task-card-item">${t.title}</div>`).join('') || '<p style="font-size:12px; color:var(--muted);">Немає завдань</p>';
}

function addNewTask() {
    const title = document.getElementById('newTaskTitle').value.trim();
    if (!title) return;
    if (!currentUser.tasks) currentUser.tasks = [];
    currentUser.tasks.push({ title });
    DB.setCurrentUser(currentUser);
    document.getElementById('newTaskTitle').value = '';
    renderTasks();
}

function navigateTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll(`[data-page="${pageId}"]`).forEach(b => b.classList.add('active'));
}

document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-page')));
});

window.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('currentDateStr').textContent = now.toLocaleDateString('uk-UA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    initApp();
});
</script>
</body>
</html>
