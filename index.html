<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер штрихкодів</title>
  <!-- Підключення бібліотеки Html5Qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .scanner-card {
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #reader {
      width: 100%;
      margin-top: 15px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
    }
    button.stop-btn {
      background-color: #dc3545;
    }
  </style>
</head>
<body>

<div class="scanner-card">
  <h2>Зчитування пластикових карт / штрихкодів</h2>
  
  <div class="input-group">
    <label for="barcode-input">Код картки або штрихкод:</label>
    <input type="text" id="barcode-input" placeholder="Скануйте або введіть вручну..." autofocus>
  </div>

  <button id="toggle-scan-btn">Увімкнути камеру для сканування</button>

  <!-- Контейнер для відеопотоку камери -->
  <div id="reader" style="display: none;"></div>
</div>

<script>
  const barcodeInput = document.getElementById('barcode-input');
  const toggleBtn = document.getElementById('toggle-scan-btn');
  const readerDiv = document.getElementById('reader');
  
  let html5QrcodeScanner = null;
  let isScanning = false;

  // 1. Обробка фізичного/USB сканера штрихкодів (працює як ввід клавіатури)
  barcodeInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const code = this.value.trim();
      if (code) {
        onCodeScanned(code);
      }
    }
  });

  // 2. Функція після успішного зчитування
  function onCodeScanned(decodedText) {
    barcodeInput.value = decodedText;
    console.log("Зчитано код:", decodedText);

    // Додаткові дії (наприклад, автоматичний пошук у базі даних)
    // processCardData(decodedText);

    if (isScanning) {
      stopCameraScanner();
    }
  }

  // 3. Управління сканером через камеру
  toggleBtn.addEventListener('click', () => {
    if (isScanning) {
      stopCameraScanner();
    } else {
      startCameraScanner();
    }
  });

  function startCameraScanner() {
    readerDiv.style.display = 'block';
    toggleBtn.textContent = 'Вимкнути камеру';
    toggleBtn.classList.add('stop-btn');
    isScanning = true;

    html5QrcodeScanner = new Html5Qrcode("reader");
    
    // Підтримка різних форматів штрихкодів (EAN-13, CODE-128, QR тощо)
    const config = { 
      fps: 10, 
      qrbox: { width: 250, height: 150 },
      formatsToSupport: [ 
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    };

    html5QrcodeScanner.start(
      { facingMode: "environment" }, // Використовувати задню камеру
      config,
      (decodedText) => onCodeScanned(decodedText),
      (errorMessage) => {
        // Помилки сканування кадру можна ігнорувати
      }
    ).catch(err => {
      console.error("Помилка запуску камери:", err);
      stopCameraScanner();
    });
  }

  function stopCameraScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        toggleBtn.textContent = 'Увімкнути камеру для сканування';
        toggleBtn.classList.remove('stop-btn');
        isScanning = false;
      }).catch(err => console.error(err));
    }
  }
</script>

</body>
</html>
